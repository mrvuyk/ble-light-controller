workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Build APK
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/**/outputs/**/*.apk